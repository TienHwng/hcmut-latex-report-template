# Check and build the report on GitHub.
#   lint                 -> ChkTeX with .chktexrc; any warning fails the check
#   build                -> PDF downloadable from the run page ("Artifacts")
#   push a tag v*        -> PDF also attached to a GitHub Release
#                           e.g.  git tag v1.0 && git push origin v1.0
# The two jobs run in parallel, so a lint warning never blocks the PDF.
name: Build PDF

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release on tags

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # chktex exits with a non-zero code when it reports a warning.
      - uses: xu-cheng/texlive-action@v3
        with:
          run: chktex -q -l .chktexrc main.tex

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Full TeX Live + latexmk; .latexmkrc puts main.pdf in the root.
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex

      - uses: actions/upload-artifact@v7
        with:
          name: report-pdf
          path: main.pdf

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: main.pdf
